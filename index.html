<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0916">
<title>今日签运 · 只此一签</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b33a3a'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23f6ecd4' font-family='serif'%3E签%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0c0916;
    --gold:#e6c884;
    --gold-2:#c9a45c;
    --red:#b33a3a;
    --paper:#f6ecd4;
    --ink:#2a1d12;
    --muted:#9a8fb0;
    --line:rgba(230,200,132,.18);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    padding:34px 18px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(1100px 700px at 50% -12%, #2b1b49 0%, #171026 46%, #0a0712 100%);
    color:#eee;
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"SimSun",serif;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 10% 20%, rgba(230,200,132,.08), transparent 26%),
      radial-gradient(circle at 90% 6%, rgba(150,90,210,.12), transparent 30%),
      radial-gradient(circle at 50% 108%, rgba(179,58,58,.10), transparent 42%);
    z-index:0;
  }
  .moon{
    position:fixed;
    top:-110px;
    left:50%;
    width:520px;
    height:520px;
    transform:translateX(-50%);
    border-radius:50%;
    border:1px solid rgba(230,200,132,.07);
    box-shadow:0 0 120px rgba(230,200,132,.04) inset;
    pointer-events:none;
    z-index:0;
  }
  .moon::after{
    content:"";
    position:absolute;
    inset:80px;
    border-radius:50%;
    border:1px solid rgba(230,200,132,.05);
  }
  header,main,footer{position:relative;z-index:1;width:100%}
  header{text-align:center;margin-bottom:24px}
  .seal{
    width:48px;height:48px;
    margin:0 auto 14px;
    display:grid;place-items:center;
    color:#f8eccd;
    background:linear-gradient(145deg,#c1453f,#8f2928);
    border:1px solid rgba(255,220,160,.45);
    border-radius:8px;
    font-size:25px;
    font-family:"STKaiti","KaiTi",var(--font,serif);
    box-shadow:0 8px 24px rgba(140,30,30,.4), inset 0 0 0 3px rgba(255,230,180,.08);
    transform:rotate(-3deg);
  }
  h1{
    margin:0 0 10px;
    font-size:clamp(34px,7vw,46px);
    font-weight:700;
    letter-spacing:.16em;
    text-indent:.16em;
    background:linear-gradient(180deg,#faecc9 0%,#e3c184 52%,#b78b43 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 4px 18px rgba(230,200,132,.18));
  }
  .sub{
    margin:0;
    font-size:12px;
    letter-spacing:.32em;
    text-indent:.32em;
    color:var(--muted);
  }
  .panel{
    width:min(560px,100%);
    margin:0 auto;
    padding:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid var(--line);
    border-radius:22px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .hidden{display:none !important}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:20px;
  }
  .kicker{font-size:13px;letter-spacing:.28em;color:var(--gold);opacity:.9}
  .lock-hint{
    flex:none;
    padding:5px 10px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.08em;
  }
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .label{font-size:15px;color:#f1e7d4;letter-spacing:.08em}
  .sub-label{margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:.06em}
  .stepper{
    display:flex;align-items:center;gap:4px;
    padding:5px;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(230,200,132,.15);
    border-radius:999px;
  }
  .stepper button{
    width:34px;height:34px;
    display:grid;place-items:center;
    border:0;border-radius:50%;
    background:transparent;
    color:var(--gold);
    font-size:20px;line-height:1;
    font-family:inherit;
    cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .stepper button:hover{background:rgba(230,200,132,.12)}
  .stepper button:active{transform:scale(.9)}
  .stepper span{
    min-width:42px;text-align:center;
    font-size:20px;color:var(--paper);
    font-variant-numeric:tabular-nums;
  }
  .inputs{display:flex;flex-direction:column;gap:8px;margin:18px 0 12px}
  .input-row{display:flex;align-items:center;gap:9px;animation:rowIn .25s ease both}
  @keyframes rowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .idx{
    flex:none;width:20px;
    font-size:11px;letter-spacing:.06em;
    color:var(--gold);opacity:.55;
    font-variant-numeric:tabular-nums;
  }
  .input-row input{
    flex:1;min-width:0;
    padding:12px 14px;
    border:1px solid rgba(230,200,132,.14);
    border-radius:10px;
    background:rgba(9,6,16,.55);
    color:#f3ead7;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .input-row input::placeholder{color:#6f6482}
  .input-row input:focus{
    border-color:rgba(230,200,132,.6);
    background:rgba(9,6,16,.75);
    box-shadow:0 0 0 3px rgba(230,200,132,.08);
  }
  .del{
    flex:none;width:30px;height:30px;
    display:grid;place-items:center;
    border:0;border-radius:50%;
    background:transparent;
    color:#7b6f8d;
    font-size:19px;line-height:1;
    font-family:inherit;
    cursor:pointer;
    transition:color .2s, background .2s;
  }
  .del:hover{color:#e08a8a;background:rgba(179,58,58,.14)}
  .ghost{
    width:100%;
    margin-bottom:14px;
    padding:11px;
    border:1px dashed rgba(230,200,132,.35);
    border-radius:10px;
    background:transparent;
    color:var(--gold);
    font-family:inherit;
    font-size:14px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .ghost:hover{background:rgba(230,200,132,.08);border-color:var(--gold)}
  .primary{
    width:100%;
    padding:15px 18px;
    border:0;border-radius:12px;
    background:linear-gradient(135deg,#f2dda8 0%,#dcb56a 52%,#b98d3d 100%);
    color:#2a1a0c;
    font-family:inherit;
    font-size:17px;font-weight:700;
    letter-spacing:.18em;text-indent:.18em;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(212,171,92,.25), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .15s, box-shadow .15s, filter .15s;
  }
  .primary:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 14px 36px rgba(212,171,92,.32), inset 0 1px 0 rgba(255,255,255,.55)}
  .primary:active{transform:scale(.985)}
  .primary:disabled{opacity:.7;cursor:wait;transform:none}
  .footnote{
    margin:14px 0 0;
    text-align:center;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--muted);
    line-height:1.7;
  }

  /* ---------- 签筒 ---------- */
  .stage-panel{padding:36px 24px 28px;text-align:center;overflow:hidden}
  .tube-wrap{
    height:214px;
    display:flex;align-items:flex-end;justify-content:center;
    margin-bottom:4px;
    filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));
  }
  .tube{position:relative;width:132px;height:198px;will-change:transform}
  .stick{
    position:absolute;bottom:88px;left:50%;
    width:7px;height:100px;
    border-radius:4px 4px 2px 2px;
    background:linear-gradient(180deg,#fbf0d2 0%,#e2ca96 65%,#b3935b 100%);
    transform-origin:50% 100%;
    box-shadow:0 0 6px rgba(0,0,0,.25);
    z-index:1;
  }
  .stick::after{
    content:"";position:absolute;top:9px;left:0;right:0;height:10px;
    border-radius:2px;background:#b33a3a;
  }
  .stick:nth-child(1){left:36%;height:104px;transform:rotate(-23deg)}
  .stick:nth-child(2){left:42%;height:96px;transform:rotate(-16deg)}
  .stick:nth-child(3){left:47%;height:110px;transform:rotate(-9deg)}
  .stick:nth-child(4){left:50%;height:92px;transform:rotate(-2deg)}
  .stick:nth-child(5){left:54%;height:106px;transform:rotate(5deg)}
  .stick:nth-child(6){left:58%;height:98px;transform:rotate(12deg)}
  .stick:nth-child(7){left:63%;height:108px;transform:rotate(19deg)}
  .stick:nth-child(8){left:39%;height:90px;transform:rotate(-12deg)}
  .stick:nth-child(9){left:61%;height:94px;transform:rotate(9deg)}
  .tube-body{
    position:absolute;left:0;bottom:0;
    width:132px;height:126px;
    border-radius:10px 10px 18px 18px;
    background:linear-gradient(90deg,#451114 0%,#832b2c 20%,#a5413b 50%,#782427 80%,#3d0d10 100%);
    box-shadow:inset 0 0 0 2px rgba(230,200,132,.2), inset -14px 0 24px rgba(0,0,0,.35);
    z-index:2;
  }
  .tube-body::before{
    content:"签";
    position:absolute;inset:0;
    display:grid;place-items:center;
    color:rgba(246,236,212,.92);
    font-size:46px;
    font-family:"STKaiti","KaiTi",serif;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .tube-body::after{
    content:"";position:absolute;left:8px;right:8px;top:10px;bottom:10px;
    border:1px solid rgba(230,200,132,.24);
    border-radius:6px 6px 12px 12px;
  }
  .tube-mouth{
    position:absolute;left:-3px;bottom:112px;
    width:138px;height:30px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%,#2a0d0e,#100506 72%);
    border:3px solid rgba(230,200,132,.55);
    box-shadow:0 0 20px rgba(0,0,0,.6);
    z-index:3;
  }
  .tube.shaking{animation:tubeShake .55s ease-in-out infinite}
  @keyframes tubeShake{
    0%,100%{transform:rotate(0) translateY(0)}
    15%{transform:rotate(-5deg) translateY(-2px)}
    30%{transform:rotate(4deg) translateY(0)}
    45%{transform:rotate(-3deg) translateY(-4px)}
    60%{transform:rotate(5deg) translateY(0)}
    75%{transform:rotate(-2deg) translateY(-1px)}
  }
  .tube.shaking .stick{animation:stickWiggle .42s ease-in-out infinite}
  @keyframes stickWiggle{0%,100%{translate:0 0}50%{translate:2px -3px}}
  .tube.pop{animation:tubePop .45s cubic-bezier(.2,1.3,.4,1)}
  @keyframes tubePop{
    0%{transform:scale(1)}
    35%{transform:scale(1.08,.92)}
    70%{transform:scale(.97,1.04)}
    100%{transform:scale(1)}
  }
  .roll{
    min-height:38px;
    margin-top:8px;
    font-size:22px;
    letter-spacing:.16em;
    color:var(--gold);
    text-shadow:0 0 24px rgba(230,200,132,.28);
  }
  .stage-tip{
    margin:6px 0 0;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--muted);
  }

  /* ---------- 结果 ---------- */
  .result-panel{padding:26px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .lot{
    position:relative;
    padding:30px 22px 24px;
    border-radius:14px;
    background:linear-gradient(180deg,#fdf6e3 0%,#f2e4c2 100%);
    color:var(--ink);
    text-align:center;
    overflow:hidden;
    box-shadow:0 22px 60px rgba(0,0,0,.48), inset 0 0 0 1px rgba(120,80,30,.2);
  }
  .lot::before{
    content:"";position:absolute;inset:10px;
    border:1px solid rgba(150,40,40,.32);
    border-radius:8px;
    pointer-events:none;
  }
  .lot::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(120,80,30,.025) 0 1px,transparent 1px 4px);
    pointer-events:none;
  }
  .lot-stamp{
    position:absolute;top:16px;right:14px;
    padding:4px 7px;
    border:2px solid rgba(179,58,58,.5);
    border-radius:5px;
    color:rgba(179,58,58,.65);
    font-size:10px;letter-spacing:.18em;
    transform:rotate(8deg);
    z-index:2;
  }
  .lot-top{
    position:relative;z-index:1;
    font-size:12px;letter-spacing:.32em;text-indent:.32em;
    color:#9a3b32;
  }
  .lot-content{
    position:relative;z-index:1;
    margin:20px 0 18px;
    font-size:clamp(30px,8vw,54px);
    font-weight:700;
    line-height:1.3;
    letter-spacing:.06em;
    color:#7d1f1a;
    word-break:break-word;
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  }
  .lot-rule{
    position:relative;z-index:1;
    width:54px;height:1px;margin:0 auto 12px;
    background:linear-gradient(90deg,transparent,rgba(140,90,40,.5),transparent);
  }
  .lot-bottom{
    position:relative;z-index:1;
    font-size:10px;letter-spacing:.28em;text-indent:.28em;
    color:#a08355;
  }
  .lot.special{
    box-shadow:0 24px 90px rgba(200,120,60,.35), inset 0 0 0 1px rgba(120,80,30,.25);
  }
  .lot.special::before{border-color:rgba(190,120,40,.55)}
  .lot.special .lot-content{
    color:#a3201c;
    text-shadow:0 0 30px rgba(255,170,100,.45);
    animation:specialPulse 2.6s ease-in-out infinite;
  }
  @keyframes specialPulse{
    0%,100%{text-shadow:0 0 22px rgba(255,170,100,.3)}
    50%{text-shadow:0 0 38px rgba(255,170,100,.65)}
  }
  .result-actions{margin-top:18px}
  .result-actions .primary{font-size:16px;padding:14px}

  /* ---------- 付费弹窗 ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(5,3,10,.74);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    animation:fade .22s ease both;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{
    position:relative;
    width:min(380px,100%);
    max-height:calc(100dvh - 36px);
    overflow:auto;
    padding:26px 24px 20px;
    border:1px solid rgba(230,200,132,.3);
    border-radius:22px;
    background:linear-gradient(180deg,#1d1533 0%,#120d21 100%);
    box-shadow:0 30px 100px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
    text-align:center;
    animation:pop .3s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  .modal-close{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;
    display:grid;place-items:center;
    border:0;border-radius:50%;
    background:rgba(255,255,255,.05);
    color:#a99dbd;
    font-size:20px;line-height:1;
    font-family:inherit;
    cursor:pointer;
  }
  .modal-close:hover{background:rgba(255,255,255,.1);color:#fff}
  .modal-kicker{font-size:11px;letter-spacing:.32em;text-indent:.32em;color:var(--gold);opacity:.8}
  .modal-card h2{margin:10px 0 8px;font-size:26px;letter-spacing:.1em;color:#f7edd8;font-weight:700}
  .modal-sub{margin:0;font-size:12px;line-height:1.9;color:#a99dbd;letter-spacing:.04em}
  .price{
    margin:16px 0 14px;
    font-size:38px;font-weight:700;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .price span{font-size:20px;margin-right:2px;vertical-align:6px}
  .qr-wrap{
    position:relative;
    width:190px;height:190px;
    margin:0 auto 14px;
    padding:11px;
    background:#fffdf6;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .qr-wrap canvas{display:block;width:168px;height:168px;border-radius:4px}
  .qr-badge{
    position:absolute;top:50%;left:50%;
    width:36px;height:36px;
    display:grid;place-items:center;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:linear-gradient(145deg,#c1453f,#8f2928);
    border:3px solid #fffdf6;
    color:#f8eccd;
    font-size:18px;
    font-family:"STKaiti","KaiTi",serif;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .pay-methods{display:flex;gap:8px;margin-bottom:12px}
  .method{
    flex:1;
    padding:9px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    background:transparent;
    color:#a99dbd;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:.2s;
  }
  .method.active{
    border-color:rgba(230,200,132,.55);
    background:rgba(230,200,132,.1);
    color:var(--gold);
  }
  .primary.small{padding:12px;font-size:14px;letter-spacing:.1em;text-indent:.1em}
  .pay-status{
    min-height:16px;
    margin:12px 0 0;
    font-size:11px;
    letter-spacing:.04em;
    color:#8d82a2;
    line-height:1.6;
  }
  .pay-status.bad{color:#e08a8a}
  .modal-fine{
    margin:10px 0 0;
    font-size:10px;
    color:#6d6381;
    letter-spacing:.04em;
  }

  /* ---------- toast / 彩纸 ---------- */
  #fx{position:fixed;inset:0;z-index:40;pointer-events:none}
  #toast{
    position:fixed;left:50%;bottom:32px;z-index:120;
    max-width:calc(100vw - 40px);
    padding:11px 18px;
    border:1px solid rgba(230,200,132,.3);
    border-radius:999px;
    background:rgba(24,16,38,.96);
    color:#f2e6cf;
    font-size:13px;
    letter-spacing:.04em;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    opacity:0;
    transform:translate(-50%,14px);
    transition:opacity .25s, transform .25s;
    pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  footer{
    margin-top:22px;
    text-align:center;
    font-size:10px;
    letter-spacing:.18em;
    color:#5f5573;
  }
  body.modal-open{overflow:hidden}

  @media (max-width:480px){
    body{padding:26px 14px 30px}
    .panel{padding:20px;border-radius:18px}
    .result-panel{padding:20px}
    .lot{padding:26px 16px 20px}
    .modal-card{padding:24px 18px 18px}
    h1{font-size:36px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header>
  <div class="seal" aria-hidden="true">签</div>
  <h1>今日签运</h1>
  <p class="sub">心诚则灵 · 只此一签</p>
</header>

<main>
  <section id="setup" class="panel" aria-label="设定签筒">
    <div class="panel-head">
      <span class="kicker">签筒设定</span>
      <span class="lock-hint">◆ 抽后即封</span>
    </div>
    <div class="row-between">
      <div>
        <div class="label">签的数量</div>
        <div class="sub-label">最多 12 支，每支签写一句话</div>
      </div>
      <div class="stepper">
        <button id="minus" type="button" aria-label="减少一支签">−</button>
        <span id="count" aria-live="polite">4</span>
        <button id="plus" type="button" aria-label="增加一支签">＋</button>
      </div>
    </div>
    <div id="inputs" class="inputs"></div>
    <button id="addOne" type="button" class="ghost">＋ 加一支</button>
    <button id="startBtn" type="button" class="primary">开 始 抽 签</button>
    <p class="footnote">每台设备仅限一次 · 抽中后封存，不可重复抽取</p>
  </section>

  <section id="stage" class="panel stage-panel hidden" aria-live="polite">
    <div class="tube-wrap">
      <div class="tube" id="tube">
        <span class="stick"></span><span class="stick"></span><span class="stick"></span>
        <span class="stick"></span><span class="stick"></span><span class="stick"></span>
        <span class="stick"></span><span class="stick"></span><span class="stick"></span>
        <div class="tube-mouth"></div>
        <div class="tube-body"></div>
      </div>
    </div>
    <div class="roll" id="roll">……</div>
    <p class="stage-tip">签筒摇动中，请默念心中所求…</p>
  </section>

  <section id="result" class="panel result-panel hidden" aria-live="polite">
    <div class="lot" id="lot">
      <div class="lot-stamp">已抽取</div>
      <div class="lot-top">第 <span id="lotNo">1</span> 签</div>
      <div class="lot-content" id="lotContent">—</div>
      <div class="lot-rule"></div>
      <div class="lot-bottom">今日签运 · 仅此一签</div>
    </div>
    <div class="result-actions">
      <button id="againBtn" type="button" class="primary">再 抽 一 次</button>
      <p class="footnote" id="resultNote">本轮签已封存 · 再抽需支付 ¥9.90</p>
    </div>
  </section>
</main>

<footer>心诚则灵 · 不可贪签</footer>

<div id="payModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="modal-card">
    <button id="closePay" class="modal-close" type="button" aria-label="关闭">×</button>
    <div class="modal-kicker">缘 分 加 钟</div>
    <h2 id="payTitle">再抽一签？</h2>
    <p class="modal-sub">同一台设备本轮仅可免费抽取一次。<br>想再试一次，请先支付香火钱。</p>
    <div class="price"><span>¥</span>9.90</div>
    <div class="qr-wrap">
      <canvas id="qr" width="168" height="168" aria-label="支付二维码"></canvas>
      <div class="qr-badge" aria-hidden="true">签</div>
    </div>
    <div class="pay-methods">
      <button class="method active" type="button" data-m="wechat">微信支付</button>
      <button class="method" type="button" data-m="alipay">支付宝</button>
    </div>
    <button id="payDone" type="button" class="primary small">我 已 完 成 支 付</button>
    <p class="pay-status" id="payStatus">支付后自动解锁第二签</p>
    <p class="modal-fine">演示页面 · 二维码不可真实支付，不会产生扣款</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="text-align:center;color:#e6c884">需要开启 JavaScript 才能抽签。</p></noscript>

<script>
(function () {
  'use strict';

  const LS_KEY = 'jinri_qianyun_v1';
  const GU = '顾熠欢';
  const MAX = 12;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  const state = {
    contents: ['上上签', '中吉', '小吉', '下下签'],
    locked: null,
    drawing: false
  };

  /* 调试用：打开 ?reset=1 可清空本机抽签记录 */
  try {
    const u = new URL(location.href);
    if (u.searchParams.get('reset') === '1') {
      localStorage.removeItem(LS_KEY);
      u.searchParams.delete('reset');
      const qs = u.searchParams.toString();
      history.replaceState(null, '', u.pathname + (qs ? '?' + qs : '') + u.hash);
    }
  } catch (e) { /* ignore */ }

  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.contents) || !data.contents.length) return;
      state.contents = data.contents.map(String).slice(0, MAX);
      if (data.drawn === true && Number.isInteger(data.index) && state.contents[data.index] != null) {
        state.locked = data;
      }
    } catch (e) { /* ignore */ }
  }

  function persist(data) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
  }

  function saveDraft() {
    if (state.locked) return;
    persist({ contents: state.contents, drawn: false, ts: Date.now() });
  }

  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function renderInputs() {
    const wrap = $('#inputs');
    wrap.textContent = '';
    state.contents.forEach((value, i) => {
      const row = document.createElement('div');
      row.className = 'input-row';

      const num = document.createElement('span');
      num.className = 'idx';
      num.textContent = String(i + 1).padStart(2, '0');

      const input = document.createElement('input');
      input.type = 'text';
      input.value = value;
      input.maxLength = 40;
      input.autocomplete = 'off';
      input.placeholder = '第 ' + (i + 1) + ' 签的内容';
      input.addEventListener('input', () => {
        state.contents[i] = input.value;
        saveDraft();
      });
      input.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        const all = $$('#inputs input');
        if (i < all.length - 1) all[i + 1].focus();
        else begin();
      });

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', '删除第 ' + (i + 1) + ' 支签');
      del.addEventListener('click', () => removeAt(i));

      row.append(num, input, del);
      wrap.appendChild(row);
    });
    $('#count').textContent = String(state.contents.length);
  }

  function removeAt(i) {
    if (state.locked) return;
    if (state.contents.length <= 1) {
      toast('至少留下最后一支签');
      return;
    }
    state.contents.splice(i, 1);
    saveDraft();
    renderInputs();
  }

  function setCount(n) {
    if (state.locked) return;
    n = Math.max(1, Math.min(MAX, n));
    if (n === state.contents.length) return;
    while (state.contents.length < n) state.contents.push('');
    state.contents.length = n;
    saveDraft();
    renderInputs();
  }

  function addOne() {
    if (state.locked) return;
    if (state.contents.length >= MAX) {
      toast('签筒最多容纳 ' + MAX + ' 支签');
      return;
    }
    state.contents.push('');
    saveDraft();
    renderInputs();
    const all = $$('#inputs input');
    const last = all[all.length - 1];
    if (last) {
      last.scrollIntoView({ block: 'nearest' });
      last.focus();
    }
  }

  function randInt(n) {
    try {
      const a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    } catch (e) {
      return Math.floor(Math.random() * n);
    }
  }

  function begin() {
    if (state.drawing || state.locked) return;
    const inputs = $$('#inputs input');
    const values = inputs.map(inp => inp.value.trim());
    if (!values.length) {
      toast('先设定至少一支签');
      return;
    }
    const empty = values.findIndex(v => !v);
    if (empty >= 0) {
      inputs[empty].focus();
      toast('第 ' + (empty + 1) + ' 支签还没有内容');
      return;
    }

    state.contents = values.slice();
    persist({ contents: state.contents, drawn: false, ts: Date.now() });

    $('#setup').classList.add('hidden');
    $('#result').classList.add('hidden');
    $('#stage').classList.remove('hidden');
    state.drawing = true;

    // 命中「顾熠欢」时，第一签直接是她
    const guIndex = state.contents.findIndex(v => v.includes(GU));
    const target = guIndex >= 0 ? guIndex : randInt(state.contents.length);

    const tube = $('#tube');
    const roll = $('#roll');
    tube.classList.remove('pop');
    tube.classList.add('shaking');
    roll.textContent = '……';

    const started = performance.now();
    const DUR = 2400;
    let lastSwap = 0;

    function frame(now) {
      const p = Math.min(1, (now - started) / DUR);
      if (p < 1) {
        if (now - lastSwap > 45 + 620 * Math.pow(p, 2.6)) {
          lastSwap = now;
          roll.textContent = state.contents[randInt(state.contents.length)];
        }
        requestAnimationFrame(frame);
        return;
      }

      tube.classList.remove('shaking');
      tube.classList.add('pop');
      roll.textContent = '签 成';
      state.drawing = false;
      state.locked = {
        contents: state.contents.slice(),
        index: target,
        drawn: true,
        ts: Date.now()
      };
      persist(state.locked);

      setTimeout(() => showResult(target, true), 420);
    }
    requestAnimationFrame(frame);
  }

  function showResult(index, confetti) {
    const text = state.contents[index];
    if (text == null) return;
    const special = text.includes(GU);

    $('#setup').classList.add('hidden');
    $('#stage').classList.add('hidden');
    const res = $('#result');
    res.classList.remove('hidden');
    res.style.animation = 'none';
    void res.offsetWidth;
    res.style.animation = '';

    $('#lotNo').textContent = String(index + 1);
    $('#lotContent').textContent = text;
    $('#lot').classList.toggle('special', special);
    $('#resultNote').textContent = special
      ? '命里有时终须有 · 此签已封存'
      : '本轮签已封存 · 再抽需支付 ¥9.90';

    if (confetti) setTimeout(burst, 160);
  }

  /* ---------------- 彩纸 ---------------- */
  const canvas = $('#fx');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fxRaf = null;
  let DPR = 1;

  function sizeCanvas() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(innerWidth * DPR);
    canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  sizeCanvas();
  addEventListener('resize', sizeCanvas);

  function burst() {
    const rect = $('#lot').getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.42;
    const colors = ['#e6c884', '#b33a3a', '#f4e3b2', '#d98b8b', '#fff6dd', '#8f6bb0'];
    for (let i = 0; i < 150; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 10;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        g: 0.12 + Math.random() * 0.16,
        w: 4 + Math.random() * 7,
        h: 6 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        life: 1,
        decay: 0.006 + Math.random() * 0.008,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(loopFx);
  }

  function loopFx() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > innerHeight + 40) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (particles.length) {
      fxRaf = requestAnimationFrame(loopFx);
    } else {
      fxRaf = null;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  /* ---------------- 付费弹窗 ---------------- */
  function drawQR() {
    const c = $('#qr');
    const q = c.getContext('2d');
    const N = 29;
    const size = c.width;
    const cell = size / N;
    q.clearRect(0, 0, size, size);
    q.fillStyle = '#fffdf6';
    q.fillRect(0, 0, size, size);

    let seed = 20261117;
    const rnd = () => {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    };
    const finders = [[1, 1], [N - 8, 1], [1, N - 8]];
    const inFinder = (x, y) => finders.some(([fx, fy]) =>
      x >= fx - 1 && x <= fx + 7 && y >= fy - 1 && y <= fy + 7
    );

    q.fillStyle = '#191024';
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (inFinder(x, y)) continue;
        if (rnd() > 0.55) q.fillRect(x * cell, y * cell, cell * 0.92, cell * 0.92);
      }
    }
    finders.forEach(([fx, fy]) => {
      q.fillStyle = '#191024';
      q.fillRect(fx * cell, fy * cell, 7 * cell, 7 * cell);
      q.fillStyle = '#fffdf6';
      q.fillRect((fx + 1) * cell, (fy + 1) * cell, 5 * cell, 5 * cell);
      q.fillStyle = '#191024';
      q.fillRect((fx + 2) * cell, (fy + 2) * cell, 3 * cell, 3 * cell);
    });
  }

  let verifying = false;

  function openPay() {
    $('#payModal').classList.remove('hidden');
    document.body.classList.add('modal-open');
    const btn = $('#payDone');
    btn.disabled = false;
    btn.textContent = '我 已 完 成 支 付';
    const st = $('#payStatus');
    st.textContent = '支付后自动解锁第二签';
    st.classList.remove('bad');
    verifying = false;
    drawQR();
  }

  function closePay() {
    $('#payModal').classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  function verifyPay() {
    if (verifying) return;
    verifying = true;
    const btn = $('#payDone');
    const st = $('#payStatus');
    btn.disabled = true;
    btn.textContent = '正 在 核 验 支 付…';
    st.textContent = '正在向支付网关查询…';
    st.classList.remove('bad');

    setTimeout(() => {
      verifying = false;
      btn.disabled = false;
      btn.textContent = '重 新 核 验 支 付';
      st.textContent = '核验失败：未收到 ¥9.90 的付款';
      st.classList.add('bad');
      toast('没有查到付款记录，再试一次？');
    }, 1900);
  }

  /* ---------------- 事件绑定 ---------------- */
  $('#minus').addEventListener('click', () => setCount(state.contents.length - 1));
  $('#plus').addEventListener('click', () => setCount(state.contents.length + 1));
  $('#addOne').addEventListener('click', addOne);
  $('#startBtn').addEventListener('click', begin);
  $('#againBtn').addEventListener('click', openPay);
  $('#closePay').addEventListener('click', closePay);
  $('#payDone').addEventListener('click', verifyPay);

  $('#payModal').addEventListener('click', (ev) => {
    if (ev.target.id === 'payModal') closePay();
  });

  $$('.method').forEach((btn) => {
    btn.addEventListener('click', () => {
      $$('.method').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const st = $('#payStatus');
      st.classList.remove('bad');
      st.textContent = btn.dataset.m === 'alipay' ? '支付宝通道已就绪' : '微信通道已就绪';
    });
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !$('#payModal').classList.contains('hidden')) closePay();
  });

  /* ---------------- 启动 ---------------- */
  load();
  if (state.locked) {
    showResult(state.locked.index, false);
  } else {
    renderInputs();
  }
})();
</script>
</body>
</html>
